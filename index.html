<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Flappy Fish</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="480" height="720"></canvas>
    <div class="score-container" style="display: none;">
      <span class="score-label">Score</span>
      <span class="score-value">0</span>
    </div>
    <div id="start-screen" class="overlay">
      <div class="start-fish-glow">
        <img src="fish.png" alt="Fish" class="start-fish-img" />
      </div>
      <h1 class="game-title">🐟 Flappy Fish</h1>
      <p class="game-subtitle">Dive into the electric depths!<br>Help the fish swim through the electrified pipes.<br><span class="hint">Tap or press space to swim!</span></p>
      <div id="start-bubbles"></div>
      <button id="start-btn">Start Game</button>
    </div>
    <div id="gameover-screen" class="overlay">
      <h1>⚡ GAME OVER ⚡</h1>
      <div class="score-container">
        <div id="final-score">0</div>
      </div>
      <button id="restart-btn">Play Again!</button>
    </div>
    <div id="offline-banner" class="overlay">No Internet Connection</div>
    <button id="install-btn" style="display:none;">Install App</button>
  </div>
  <audio id="bg-music" src="game-music-loop-6-144641.mp3" loop></audio>
  <audio id="jump-sound" src="bubbles-03-91268.mp3"></audio>
  <audio id="gameover-sound" src="game-over-transition-fx-178632.mp3"></audio>
  <audio id="zap-sound" src="electric_zap_001-6374.mp3"></audio>
  <audio id="bling-sound" src="bling.mp3"></audio>
  <script src="main.js"></script>
</body>
</html>
